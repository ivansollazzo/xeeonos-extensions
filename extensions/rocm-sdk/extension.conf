# Extension rocm-sdk (optional): everything to build and run ROCm programs
# (docs/rocm.md): hipcc, the HIP and OpenCL SDKs and their math libraries
# (rocBLAS, rocFFT, rocRAND, rocSPARSE, rocSOLVER, hipBLAS, ...), with their
# headers. Several GB. Includes everything of the extension rocm: turn on
# one of the two.
Description="AMD ROCm SDK: hipcc, HIP and OpenCL SDKs, math libraries, headers"
Special=no
Default=no
Packages="rocm-hip-sdk rocm-opencl-sdk rocminfo rocm-smi-lib gcc binutils"
# The headers and pkg-config files are what an SDK is for.
KeepDevelopment=yes
# The system image has no headers (its C library's and the kernel's are
# removed): compiling needs them, so these come again, whole.
Reinstall="glibc linux-api-headers"
