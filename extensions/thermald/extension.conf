# Extension thermald (optional): Intel's thermal daemon. It keeps an Intel
# processor below its temperature limits with gentle measures (power limits,
# fan, clocks) before the hardware throttles hard. Only for Intel processors:
# on others the service stops at once and does nothing.
Description="thermald: keeps Intel processors cool before they slow down"
Special=no
Default=no
Packages="thermald"
Enable="thermald.service"
