# Extension gaming (optional): better performance in games (docs/gaming.md).
# - GameMode: while a game runs, CPU and GPU at full power and the game
#   first in line. Games from Flathub (Steam, Heroic, Lutris) ask for it
#   through the desktop portal; any user at the computer may use it.
# - scx_lavd: a CPU scheduler made for games (sched_ext, in the kernel),
#   smoother frames and less stutter; it runs only while the extension is on.
# - kernel.split_lock_mitigate=0: no heavy slowdown of the games (mostly
#   Windows games on Proton) that use split locks.
Description="Gaming: GameMode, the scx_lavd CPU scheduler, no split-lock slowdown"
Special=no
Default=no
Packages="gamemode scx-scheds"
Enable="xeeonos-scx-lavd.service"
Boot=boot
Setup=setup
Cleanup=cleanup
