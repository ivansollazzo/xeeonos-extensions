# Extension virtualization (optional): the system part of virtual machines,
# libvirt and QEMU with KVM (docs/virtualization.md). The interface is an
# application: virt-manager or GNOME Boxes, from Flatpak.
# The service starts at the first use (socket); the administrators (group
# wheel) are put in the group "libvirt", which may use it without sudo.
Description="Virtualization: libvirt and QEMU/KVM, for virt-manager (Flatpak)"
Special=no
Default=no
Packages="libvirt qemu-base edk2-ovmf swtpm dnsmasq"
Enable="libvirtd.socket"
Setup=setup
Cleanup=cleanup
