# Extension xapp (optional, for now): XeeonOS applications, one file each
# (docs/xapp.md). Put a .xapp in ~/Applications and it is in the menu,
# double click opens it, delete it and it is gone; every application runs
# in its own sandbox (bubblewrap, seccomp, a filtered session bus), with
# its own minimal Arch system mounted read-only from the file (erofsfuse)
# and the permissions the user gave it. The program `xapp` is compiled by
# build.sh from source/; the monitor of ~/Applications is a user unit
# (xapp-sync.path). When it works well it becomes part of the system.
Description="XeeonOS applications (.xapp): one file per application in ~/Applications, each in its own sandbox"
Special=no
Default=no
Packages="bubblewrap xdg-dbus-proxy erofs-utils erofsfuse fuse3"
