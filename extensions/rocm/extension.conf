# Extension rocm (optional): AMD ROCm, to compute on AMD graphics cards
# (docs/rocm.md): the HIP and OpenCL runtimes and the tools to see the GPU.
# Enough for applications that bring their own ROCm libraries (PyTorch,
# Blender, llama.cpp builds); rocm-sdk adds what is needed to build them.
Description="AMD ROCm: HIP and OpenCL runtimes, rocminfo, rocm-smi"
Special=no
Default=no
Live=no
Packages="rocm-hip-runtime rocm-opencl-runtime rocminfo rocm-smi-lib"
