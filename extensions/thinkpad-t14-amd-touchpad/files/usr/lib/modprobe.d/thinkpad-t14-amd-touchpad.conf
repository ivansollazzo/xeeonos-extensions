# ThinkPad T14 / P14s Gen 2 AMD: run the Synaptics touchpad over RMI4/SMBus
# using the patched i2c-piix4 (ASF SMBus Host Notify), rmi_smbus and psmouse.
# (From the project's packaging/arch.)
softdep i2c_piix4 post: rmi_smbus
# psmouse hands the touchpad over to RMI4/SMBus only when asked: without
# this it stays on PS/2 ("Your touchpad (PNP: LEN2062 ...) says it can
# support a different bus ... set synaptics_intertouch to 1"), seen on a
# T14 Gen 1 AMD with XeeonOS 26.11-experimental.158.
options psmouse synaptics_intertouch=1
