# Extension thinkpad-t14-amd-touchpad (optional): the Synaptics touchpad of
# the ThinkPad T14/P14s Gen 1 and Gen 2 AMD and E495 over RMI4/SMBus instead
# of PS/2 (docs/thinkpad-t14-amd-touchpad.md): three kernel modules
# (i2c-piix4, rmi_smbus, psmouse) built with the patches of
# https://github.com/orospakr/thinkpad-t14-amd-touchpad (build.sh), for the
# exact kernel of this XeeonOS version.
Description="ThinkPad T14/P14s AMD and E495 touchpad over SMBus (patched kernel modules)"
Special=no
Default=no
Packages=""
# Kernel modules cannot be swapped in a running system: turning it on or off
# waits for the next restart.
Live=no
# The stock modules may already be loaded when the extension arrives.
Enable="xeeonos-t14-touchpad.service"
