# Extension distrobox (optional): other distributions in a container that
# feels like the system (same home directory, same user, graphical
# applications included); the way to get command line tools and packages
# the system image does not have. It brings podman with it, so it works
# alone; enabling the podman extension as well changes nothing.
Description="Distrobox: other distributions in a container, with podman"
Special=no
Default=no
Packages="distrobox podman"
