# Extension cuda (optional): NVIDIA's CUDA toolkit (docs/nvidia.md): nvcc,
# the CUDA libraries (cuBLAS, cuFFT, cuRAND, cuSPARSE, ...) and their
# headers, in /opt/cuda. Several GB. Needs nvidia to run programs and
# dev-tools (GCC) to compile them; turning it on offers to enable both.
Description="NVIDIA CUDA toolkit: nvcc, CUDA libraries, headers (several GB)"
Special=no
Default=no
Requires="nvidia dev-tools"
Packages="cuda"
# The headers are what a toolkit is for; compiling needs the C library's
# and the kernel's headers too, which the system image does not have.
KeepDevelopment=yes
Reinstall="glibc linux-api-headers"
