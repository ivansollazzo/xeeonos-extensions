# Make libvirt's packaged default NAT network visible on XeeonOS, where
# /etc starts empty. The autostart symlink makes virtnetworkd start it when
# the system connection is first used.
d /etc/libvirt 0755 root root -
d /etc/libvirt/qemu 0755 root root -
d /etc/libvirt/qemu/networks 0755 root root -
d /etc/libvirt/qemu/networks/autostart 0755 root root -
L? /etc/libvirt/qemu/networks/default.xml - - - - /usr/share/factory/etc/libvirt/qemu/networks/default.xml
L? /etc/libvirt/qemu/networks/autostart/default.xml - - - - /etc/libvirt/qemu/networks/default.xml

# The package's configs are kept under /usr/share/factory/etc; swtpm_setup
# and swtpm_localca require these paths, including when run as user tss.
L? /etc/swtpm-localca.conf - - - - /usr/share/factory/etc/swtpm-localca.conf
L? /etc/swtpm-localca.options - - - - /usr/share/factory/etc/swtpm-localca.options
L? /etc/swtpm_setup.conf - - - - /usr/share/factory/etc/swtpm_setup.conf
