# Extension libvirt (optional): host-side QEMU/KVM and libvirt for virt-manager
# from Flatpak (docs/libvirt.md). The Flatpak supplies the client; this
# extension supplies the system daemon, QEMU, networking and firmware.
Description="Libvirt and QEMU/KVM host for virt-manager Flatpak"
Special=no
Default=no
# Package tmpfiles and system services need the extension at boot.
Live=no
Packages="libvirt qemu-desktop dnsmasq iptables edk2-ovmf swtpm virt-firmware"
Enable="virtqemud.socket virtnetworkd.socket virtstoraged.socket virtnodedevd.socket virtnwfilterd.socket virtsecretd.socket"
