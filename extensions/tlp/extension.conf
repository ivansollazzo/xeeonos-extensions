# Extension tlp (optional): TLP, power saving for laptops tuned by hand
# (/etc/tlp.conf). It takes the place of power-profiles-daemon, the power
# modes of GNOME's menu: the two would fight over the same settings, so
# that one is stopped and masked while TLP is on (and so are
# systemd-rfkill's units, as TLP keeps the radios' state itself).
Description="TLP: advanced power saving for laptops (replaces the GNOME power modes)"
Special=no
Default=no
Packages="tlp"
Enable="tlp.service"
Disable="power-profiles-daemon.service systemd-rfkill.service systemd-rfkill.socket"
