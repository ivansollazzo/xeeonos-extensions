# Extension dev-tools (optional): compilers and build tools to build
# programs on the system itself: GCC, make, the autotools, CMake, Meson,
# Ninja, pkg-config, GDB, with the C library's and the kernel's headers
# (the system image has none). /usr stays read-only: what is built is
# installed in the home (~/.local), not with `make install` into /usr.
# For bigger projects, with libraries of their own, a distrobox container
# is the better place. Not base-devel: it would bring pacman back.
Description="Developer tools: GCC, make, CMake, Meson, GDB and the system headers"
Special=no
Default=no
Packages="gcc make autoconf automake libtool m4 bison flex patch pkgconf binutils cmake meson ninja gdb"
KeepDevelopment=yes
# Compiling needs the headers of the C library and of the kernel, removed
# from the system image: these come again, whole.
Reinstall="glibc linux-api-headers"
