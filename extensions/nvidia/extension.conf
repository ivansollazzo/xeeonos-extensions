# Extension nvidia (optional): NVIDIA's own driver (docs/nvidia.md), the
# open kernel modules (nvidia-open, built by Arch for the kernel of this
# XeeonOS version) and its OpenGL, Vulkan and video libraries. For GeForce
# GTX 16xx / RTX 20xx and newer (Turing onwards); older cards stay on
# Nouveau. Nouveau is turned off while it is on (nvidia-utils blacklists
# it). Kernel modules: turning it on or off waits for the next restart.
Conflicts="thinkpad-t14-amd-touchpad"
Description="NVIDIA driver (open kernel modules, GTX 16xx / RTX 20xx and newer)"
Special=no
Default=no
Packages="nvidia-open nvidia-utils"
Live=no
# Video memory kept across suspend and hibernation (NVIDIA's units), and
# the switch from Nouveau if udev loaded it before the extension arrived.
Enable="nvidia-suspend.service nvidia-hibernate.service nvidia-resume.service xeeonos-nvidia-switch.service"
