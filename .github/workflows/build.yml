name: Build

# Builds the extensions for the XeeonOS build named in xeeonos.target, checks
# them, and on a push to a channel branch (after a merge) publishes them,
# signed, as ghcr.io/<this repository>:<version>, next to the system:
#   xeeonos_<version>.<name>.xext, <name>.conf, SHA256SUMS, SHA256SUMS.gpg
# xctl downloads them from there (sudo xctl ext enable <name>) and, at each
# update, the ones turned on for the new version.
#
# Pull requests (among them the ones "Nuova build di XeeonOS" opens, which
# merge by themselves when this is green) build and check, never publish.
on:
  push:
    branches: [experimental, testing, stable]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extensions:
    name: Build and check the extensions
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Target XeeonOS build
        run: |
          source xeeonos.target
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          if [[ -z $VERSION ]]; then
            echo "No XeeonOS build targeted yet (xeeonos.target): nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Extensions for XeeonOS $VERSION ($CHANNEL)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Free disk space (rocm-sdk is several GB)
        if: env.VERSION != ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends zstd erofs-utils jq
          df -h /

      - name: The system's package list
        if: env.VERSION != ''
        run: |
          tools/fetch-system.sh "$VERSION" "$RUNNER_TEMP/system"
          zstd -d -q "$RUNNER_TEMP/system/xeeonos_$VERSION.pkgdb.tar.zst" -o "$RUNNER_TEMP/pkgdb.tar"
          snapshot=$(sed -n 's/^SNAPSHOT=//p' "$RUNNER_TEMP/system/xeeonos_$VERSION.build.txt")
          echo "SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
          echo "Arch snapshot $snapshot" >> "$GITHUB_STEP_SUMMARY"

      - name: Package cache
        if: env.VERSION != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pkgcache
          key: packages-${{ env.SNAPSHOT }}-${{ hashFiles('extensions/*/extension.conf') }}
          restore-keys: packages-${{ env.SNAPSHOT }}-

      - name: Build
        if: env.VERSION != ''
        run: |
          mkdir -p pkgcache
          MKEXT_WORK=$RUNNER_TEMP/mkext MKEXT_CACHE=pkgcache \
            tools/mkext.sh "$RUNNER_TEMP/pkgdb.tar" "$VERSION" "$SNAPSHOT" out
          (cd out && sha256sum ./* | sed 's, \./, ,' > SHA256SUMS)
          ls -lh out

      - name: Check
        if: env.VERSION != ''
        run: tools/check.sh "$VERSION" out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sign and publish
        if: env.VERSION != '' && github.event_name == 'push'
        env:
          SIGNING_KEY_ARMORED: ${{ secrets.XEEONOS_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z $SIGNING_KEY_ARMORED ]]; then
            echo "::error::XEEONOS_SIGNING_KEY is not set in this repository: nothing published"
            exit 1
          fi
          export GNUPGHOME=$RUNNER_TEMP/release-gnupg
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$SIGNING_KEY_ARMORED"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          gpg --batch --yes --local-user "$key" --detach-sign --output out/SHA256SUMS.gpg out/SHA256SUMS

          curl -sSL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz |
            tar -xz -C "$RUNNER_TEMP" oras
          oras=$RUNNER_TEMP/oras
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          "$oras" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          cd out
          "$oras" push "$repo:$VERSION" --artifact-type application/vnd.xeeonos.extensions.v1 ./*
          echo "Published $repo:$VERSION" >> "$GITHUB_STEP_SUMMARY"
