name: Nuova build di XeeonOS

# When XeeonOS publishes a build (its publish job sends a repository_dispatch
# "xeeonos-published" with the version and the channel), or by hand: a pull
# request, towards the branch of that channel, that points xeeonos.target at
# the new version. Its CI builds and checks the extensions for it; the pull
# request merges by itself when everything is green (auto-merge, for every
# channel, stable too), and the merge publishes them (build.yml).
#
# Needs the secret XEEONOS_BOT_TOKEN (fine-grained, this repository:
# Contents and Pull requests read/write; pull requests opened with the
# workflow's own token would not start the CI), and "Allow auto-merge" in
# Settings > General.
on:
  repository_dispatch:
    types: [xeeonos-published]
  workflow_dispatch:
    inputs:
      version:
        description: XeeonOS version (e.g. 26.11-experimental.42, 26.12.2)
        required: true
      channel:
        description: Its channel
        type: choice
        options: [experimental, testing, stable]

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - name: Which build
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
          CHANNEL: ${{ github.event.client_payload.channel || inputs.channel }}
        run: |
          if [[ ! $VERSION =~ ^[0-9]{2}\.[0-9]{1,2}([.-][A-Za-z0-9.]+)?$ ]] ||
             [[ ! $CHANNEL =~ ^(experimental|testing|stable)$ ]]; then
            echo "::error::bad version or channel: '$VERSION' '$CHANNEL'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "XeeonOS $VERSION ($CHANNEL)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHANNEL }}

      - name: Open the pull request, merging by itself when green
        env:
          GH_TOKEN: ${{ secrets.XEEONOS_BOT_TOKEN }}
        run: |
          if [[ -z $GH_TOKEN ]]; then
            echo "::error::XEEONOS_BOT_TOKEN is not set: no pull request for $VERSION"
            exit 1
          fi
          branch=build/$CHANNEL
          sed -i "s|^VERSION=.*|VERSION=$VERSION|; s|^CHANNEL=.*|CHANNEL=$CHANNEL|" xeeonos.target
          git config user.name "xeeonos-bot"
          git config user.email "xeeonos-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Extensions for XeeonOS $VERSION"
          # The bot's own branch: always one commit on top of the channel's.
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "$branch"
          title="Extensions for XeeonOS $VERSION"
          body="Builds the extensions for XeeonOS $VERSION ($CHANNEL). Merges by itself when the checks are green; the merge publishes them."
          number=$(gh pr list --head "$branch" --base "$CHANNEL" --state open --json number --jq '.[0].number')
          if [[ -n $number ]]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base "$CHANNEL" --head "$branch" --title "$title" --body "$body"
            number=$(gh pr list --head "$branch" --base "$CHANNEL" --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$number" --auto --squash
