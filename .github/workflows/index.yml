name: Indice estensioni

# The signed list of the extensions published for one XeeonOS version,
# ghcr.io/<this repository>:<version>, which xctl reads (tools/index.sh).
# Started by each extension the workflow "Build" publishes; also by hand.
# Runs one at a time per version; a waiting run replaced by a newer one is
# no loss, since every run lists all the extensions published so far.
on:
  workflow_dispatch:
    inputs:
      version:
        description: XeeonOS version
        required: true

concurrency:
  group: index-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  index:
    name: Signed list for ${{ inputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign and publish the list
        env:
          VERSION: ${{ inputs.version }}
          SIGNING_KEY_ARMORED: ${{ secrets.XEEONOS_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! $VERSION =~ ^[0-9]{2}\.[0-9]{1,2}([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::bad version: '$VERSION'"
            exit 1
          fi
          if [[ -z $SIGNING_KEY_ARMORED ]]; then
            echo "::error::XEEONOS_SIGNING_KEY is not set in this repository: nothing published"
            exit 1
          fi
          export GNUPGHOME=$RUNNER_TEMP/release-gnupg
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$SIGNING_KEY_ARMORED"
          export SIGNING_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')

          curl -sSL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz |
            tar -xz -C "$RUNNER_TEMP" oras
          export PATH=$RUNNER_TEMP:$PATH
          oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          tools/index.sh "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
